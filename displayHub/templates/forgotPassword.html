{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Hub</title>
    <link rel="stylesheet" href="{% static "css/forgotPassword.css" %}">
    <style>
        .error-message {
            color: #dc3545;
            background-color: #fde8e8;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            {% if messages %}
                {% for message in messages %}
                    <div class="error-message show">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            <form id="forgotPasswordForm" action="{% url "sendForgotPassOTP" %}" method="POST" class="form">
                {% csrf_token %}
                <h2>Forgot Password</h2>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    {% if request.session.forgotEmail %}
                    <input type="email" id="email" name="email" placeholder="Enter your email" value="{{ request.session.forgotEmail }}" required>
                    {% else %}
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    {% endif %}
                </div>
                <button type="submit" id="sendOtpBtn">Send OTP</button>
                <div class="timer" id="timer">45 seconds remaining</div>
            </form>
            <form id="forgotPasswordForm" action="{% url "verifyForgotOTP" %}" method="POST" class="form">
                {% csrf_token %}
                <div class="input-group">
                    <i class="fas fa-key"></i>
                    <input type="text" id="otp" name="otp" placeholder="Enter the OTP" required>
                </div>
                <button type="submit">Verify OTP</button>
            </form>
        </div>
    </div>
    
<script src="{% static "js/forgotPassword.js" %}"></script>
</body>
</html>
